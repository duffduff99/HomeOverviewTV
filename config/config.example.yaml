# ---------------------------------------------------------------------------
# House TV configuration
#
# Copy this file to config.yaml and replace the entity ids with your own.
# Changes are picked up automatically within a few seconds - no restart needed.
#
# Tip: list your entity ids with
#   docker compose run --rm house-tv entities solar
#
# The entity ids below match the built-in demo (--demo) so you can try this
# file as-is before connecting it to Home Assistant.
# ---------------------------------------------------------------------------

name: Our House
subtitle: House Channel

# Home Assistant connection. Best set via HA_URL / HA_TOKEN in the .env file.
homeassistant:
  url: ${HA_URL}
  token: ${HA_TOKEN}

display:
  safe_area: 3            # % margin on each edge, for TVs that crop the picture
  effects: true           # seasonal particles + blurred glass panels (turn off on slow hardware)
  transition_seconds: 1   # crossfade between screens
  high_contrast: false    # brighter boxes, borders and text: try true for TVs fed by a modulator
  levels: full            # full (PC, 0-255) or limited (video, 16-235): see README, Calibrating
  tabs: auto              # header tabs: auto (all if they fit, else current + next),
                          # all, compact (current + next) or hidden
  # Picture adjustments, if the image looks off after the modulator (1.0 = unchanged).
  # Calibrate the modulator first (kiosk/test-pattern.sh); use these for what's left.
  brightness: 1.0         # e.g. 1.1 = 10% brighter
  contrast: 1.0
  saturation: 1.0         # colour intensity
  time_format: 12h        # 12h or 24h
  locale: en-US

rotation:
  default_duration: 15

# Broadcast mode: the look used on a TV fed through a modulator (lifted darks,
# bigger/bolder text, no fine motion). Turn it on for the kiosk with
#   sudo ./kiosk/install-kiosk.sh --broadcast ...
# (or display.mode: broadcast for every display). Tune these by eye against
# the calibration chart: sudo ./kiosk/test-pattern.sh calibration
# Sizes are for the 1920x1080 layout; at 720p everything is 2/3 of this.
broadcast:
  min_dark: 45                # 0-255: background darks are lifted to at least this
  panel_lift: 0.12            # how much lighter panels are than the background
  panel_opacity: 0.72         # 1 = solid panels; lower lets the background show through
  panel_blur: 16              # blur behind see-through panels (0 = none)
  background_saturation: 0.85 # tone down large saturated background areas
  dither: 0.02                # light noise against gradient banding (0 = off)
  global_lift: 0              # 0-0.2: also lift darks across the whole picture (more GPU)
  red_gain: 1.0               # e.g. 1.03 if whites still look slightly cyan
  label_size: 20              # small-label size (0 = same as on a monitor)
  body_size: 28               # body/value text size (0 = same as on a monitor)
  line_width: 4               # dividers, tracks, progress bars (kept even)
  safe_area: 5                # % margin on each side for TV overscan
  transition_seconds: 1       # crossfade between screens
  animations: true            # false: fades only and still energy-flow lines, if the TV
                              # shows blockiness or jagged edges around moving things
  effects: true               # seasonal particles, same as on a monitor
  # If particles ever look blocky or jagged on the TV, try fewer, larger and slower:
  # particle_density: 0.5     #   share of the normal number
  # particle_size: 1.6        #   size multiplier
  # particle_speed: 0.5       #   speed multiplier    # seconds per screen unless the screen sets its own

# Themes: night, autumn, winter, spring, summer, holiday (or your own - see README).
# The first schedule entry whose dates include today wins; otherwise `default`.
# Home Assistant can override this with the "Theme" select entity.
theme:
  default: night
  schedule:
    - { theme: autumn,  from: "09-22", to: "11-24" }
    - { theme: holiday, from: "11-25", to: "12-31" }
    - { theme: winter,  from: "01-01", to: "03-19" }
    - { theme: spring,  from: "03-20", to: "06-20" }
    - { theme: summer,  from: "06-21", to: "09-21" }

# Always-visible top bar
header:
  weather: weather.home
  temperature: sensor.outdoor_temperature

# ---------------------------------------------------------------------------
# Screens rotate in this order. Every screen accepts:
#   title, duration (seconds), enabled (true/false), show_when (conditions)
#   tiles: extra values to show ({entity, name, icon, unit, digits, attribute})
# ---------------------------------------------------------------------------
screens:
  - type: weather
    title: Outside
    duration: 20
    weather: weather.home                 # forecast + condition
    temperature: sensor.outdoor_temperature
    humidity: sensor.outdoor_humidity
    air_quality: sensor.outdoor_pm25      # AQI number, or a PM2.5 sensor in µg/m³ (converted to AQI)
    wind: sensor.wind_speed               # optional; falls back to the weather entity
    forecast: daily                       # daily or hourly. Works with any weather
                                          # integration; for the US National Weather
                                          # Service, day and night periods are combined
    forecast_count: 5
    # Air quality gauges (up to 6), coloured by health level with the level
    # name written underneath. kind: pm25, pm10, pm1, pm03, voc, nox, co2, other
    air_gauges:                           # up to 6
      - { entity: sensor.outdoor_pm25, kind: pm25 }
      - { entity: sensor.outdoor_pm10, kind: pm10 }
      - { entity: sensor.outdoor_pm1,  kind: pm1 }
      - { entity: sensor.outdoor_voc,  kind: voc }
      - { entity: sensor.outdoor_nox,  kind: nox }
      - { entity: sensor.outdoor_co2,  kind: co2 }
    # Optional extra values (shown in a small grid):
    # tiles:
    #   - { entity: sensor.rain_today, name: Rain today, icon: rain }

  - type: energy
    title: Energy
    duration: 25
    # Today's totals and the hourly chart come straight from your
    # Home Assistant Energy dashboard - nothing to set up here.
    use_energy_dashboard: true
    # Live power flow (instantaneous W or kW sensors):
    power:
      solar: sensor.pv_power
      battery: sensor.battery_power       # positive = discharging into the house
      battery_invert: false               # set true if your sensor is positive while charging
      battery_soc: sensor.battery_soc
      grid: sensor.grid_power             # positive = importing from the grid
      grid_invert: false                  # set true if your sensor is positive while exporting
      home: sensor.home_power             # optional; calculated if left out
    tiles:                                # e.g. one per MPPT / string
      - { entity: sensor.pv1_power, name: String 1, icon: panel }
      - { entity: sensor.pv2_power, name: String 2, icon: panel }
      - { entity: sensor.pv3_power, name: String 3, icon: panel }

  # Inside: thermostat, rooms, ERV, indoor air quality. Every part is optional.
  - type: indoor
    title: Inside
    duration: 20
    climate: climate.thermostat           # HVAC mode, setpoint, what it's doing
    humidity: sensor.indoor_humidity      # whole-house humidity
    rooms:
      - { name: Living room, temperature: sensor.living_room_temperature, humidity: sensor.living_room_humidity }
      - { name: Kitchen, temperature: sensor.kitchen_temperature }
      - { name: Primary bedroom, temperature: sensor.primary_bedroom_temperature, humidity: sensor.primary_bedroom_humidity }
      - { name: Office, temperature: sensor.office_temperature }
      - { name: Basement, temperature: sensor.basement_temperature }
    erv:
      name: ERV
      mode: select.erv_mode               # any entity whose state is the mode
      status: binary_sensor.erv_running   # on/off
      boost: switch.erv_boost             # on/off
    air_gauges:                           # up to 6
      - { entity: sensor.indoor_co2,  kind: co2 }
      - { entity: sensor.indoor_voc,  kind: voc }
      - { entity: sensor.indoor_nox,  kind: nox }
      - { entity: sensor.indoor_pm25, kind: pm25 }
      - { entity: sensor.indoor_pm10, kind: pm10 }
    duct_temps:                           # optional
      - { entity: sensor.supply_air_temperature, name: Supply air }
      - { entity: sensor.return_air_temperature, name: Return air }
    equipment_power:                      # optional (W or kW sensors)
      - { entity: sensor.furnace_power, name: Furnace }
      - { entity: sensor.heat_pump_power, name: Heat pump }
      - { entity: sensor.erv_power, name: ERV }

  # Headlines from news feeds, plus Wikipedia's "On this day". The server
  # fetches these, so it needs internet access to: news.google.com (AP),
  # feeds.npr.org, feeds.bbci.co.uk and en.wikipedia.org.
  - type: news
    title: Headlines
    duration: 25
    max_headlines: 8
    max_age_hours: 24       # skip stories older than this
    on_this_day: true
    on_this_day_count: 3
    # feeds: defaults to AP, NPR and BBC. To change them, list them:
    # feeds:
    #   - { name: NPR, url: "https://feeds.npr.org/1001/rss.xml" }
    #   - { name: BBC, url: "https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml" }

  - type: cameras
    title: Cameras
    duration: 30
    mode: live              # live (HLS video via Home Assistant) or snapshot (refreshing stills)
    # Which part of each picture to keep when it's cropped to fit its tile:
    # top, center (default), bottom, or a number = % from the top (e.g. 20).
    # Set it for the whole screen here, or per camera below. fit: contain shows
    # the whole picture without cropping (with black bars).
    position: top
    snapshot_interval: 3    # seconds, for snapshot mode / fallback
    cameras:                # up to 4. Tip: use your cameras' sub-streams.
      - { entity: camera.camera_1, name: Front Yard }
      - { entity: camera.camera_2, name: Driveway }
      - { entity: camera.camera_3, name: Back Yard }
      - { entity: camera.camera_4, name: Side Gate }

  - type: calendar          # "Coming Up": calendar events and/or to-do lists
    title: Coming Up
    enabled: false          # flip to true when you start using it
    duration: 15
    days: 7                 # how far ahead to look for events
    calendars:              # optional
      - { entity: calendar.family, name: Family }
    todo_lists:             # optional: any to-do list in Home Assistant
      - { entity: todo.shopping_list, name: Shopping }
    max_tasks: 10

  - type: tiles
    title: Around the House
    duration: 15
    tiles:
      - { entity: sensor.next_trash_day, name: Trash pickup, icon: trash }
      - { entity: sensor.garage_door, name: Garage, icon: door }
      - { entity: sensor.ev_charge, name: Car battery, icon: car }
      - { entity: sensor.indoor_temperature, name: Inside, icon: thermometer }

  # A dedicated air quality screen (up to 6 gauges), if you want more detail
  # than the Outside screen shows:
  # - type: air
  #   title: Air Quality
  #   pm25: sensor.outdoor_pm25           # drives the big AQI number
  #   gauges:
  #     - { entity: sensor.outdoor_pm25, kind: pm25 }
  #     - { entity: sensor.outdoor_pm10, kind: pm10 }
  #     - { entity: sensor.outdoor_voc,  kind: voc }
  #     - { entity: sensor.outdoor_nox,  kind: nox }
  #     - { entity: sensor.outdoor_co2,  kind: co2 }
  #   tiles:
  #     - { entity: sensor.outdoor_pm03, name: PM0.3 }

  # Example of a conditional screen: only show solar strings while the sun is up.
  # - type: tiles
  #   title: Solar strings
  #   show_when:
  #     - { entity: sun.sun, state: above_horizon }
  #   tiles: [sensor.pv1_power, sensor.pv2_power, sensor.pv3_power]

# Bottom bar: what's playing. Two kinds of entity work here:
#  - media players (media_player.*): shown only while playing
#  - text sensors (sensor.*, input_text.*, text.*) whose value is the current
#    track: shown whenever they have a value. If the sensor has title/artist
#    attributes they're used automatically. Otherwise, if the text is "Artist - Title",
#    add split: " - " to show the title large and the artist underneath
#    (order: title_artist if yours is "Title - Artist").
# show_up_next: false hides the "Up Next" item shown when nothing else is
# playing; if the bar then has nothing to show, it disappears.
now_playing:
  show_up_next: true
  media_players:
    - { entity: sensor.house_fm_now_playing, name: House FM, split: " - " }
    - { entity: media_player.kitchen, name: Kitchen }

# Message board: any text entity (e.g. an input_text helper). Also settable
# from the "Message" text entity this channel adds to Home Assistant.
message:
  entity: input_text.tv_message
  chime: true                 # play a chime when a message appears or changes
  chime_volume: 60            # 0-100
  # chime_sound: doorbell.mp3 # your own sound instead: put it in config/sounds/

# Alerts: a scrolling banner while any of these are active.
#   text: fixed text, or attribute: read the text from an attribute
#   when: conditions (default: entity is on / non-zero)
#   level: warning or critical
alerts:
  - entity: binary_sensor.weather_alert
    attribute: title
    level: warning

# Pop-ups: show a camera full-screen when something happens, then go back to
# the rotation. Music is turned down while it's up.
#   to: the state that triggers it (default "on"), or "changed" for event
#       entities (e.g. event.front_doorbell) whose state is a new timestamp on every press
#   when: optional extra conditions, e.g. only after dark
interrupts:
  - entity: binary_sensor.front_door_motion
    to: "on"
    camera: camera.camera_1
    title: Someone's at the front door
    duration: 30
  # - entity: event.front_doorbell
  #   to: changed
  #   camera: camera.camera_1
  #   title: Doorbell
  #   duration: 45
  #   when:
  #     - { entity: sun.sun, state: below_horizon }

# Background music: every audio file in the music folder, on a loop.
music:
  enabled: true
  volume: 35          # 0-100
  duck_volume: 10     # volume while a camera interrupt is on screen
  shuffle: true

# MQTT: adds a "House TV" device to Home Assistant with controls for theme,
# screen, music, volume, message and screen time.
mqtt:
  enabled: true
  host: ${MQTT_HOST}
  port: 1883
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}
  discovery_prefix: homeassistant
  topic: house_tv

# ---------------------------------------------------------------------------
# Conditions (used by show_when, alerts.when):
#   { entity: sun.sun, state: above_horizon }
#   { entity: sensor.x, state: [a, b] }        any of these states
#   { entity: sensor.x, not_state: off }
#   { entity: sensor.solar_power, above: 100 }
#   { entity: sensor.x, below: 10 }
#   { entity: binary_sensor.motion, changed_within: 300 }   seconds
#   add `attribute: name` to test an attribute instead of the state
# ---------------------------------------------------------------------------
